<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <linearGradient id="emeraldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="accentGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#e9c46a" />
    </linearGradient>
    <filter id="shadowIcon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#081c15" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Emblem Background / Shield -->
  <rect x="4" y="4" width="72" height="72" rx="18" fill="url(#emeraldGradIcon)" filter="url(#shadowIcon)" />
  <rect x="6" y="6" width="68" height="68" rx="16" fill="none" stroke="url(#accentGradIcon)" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Agricultural & Feed Icon inside Emblem -->
  <g transform="translate(20, 16)">
    <!-- Central Sprout / Millet Ear -->
    <path d="M20 44 C20 30, 20 18, 20 8" stroke="#f6d365" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Left grains -->
    <ellipse cx="14" cy="14" rx="4" ry="7" transform="rotate(-30 14 14)" fill="url(#accentGradIcon)" />
    <ellipse cx="12" cy="24" rx="4" ry="7" transform="rotate(-35 12 24)" fill="url(#accentGradIcon)" />
    <ellipse cx="13" cy="34" rx="3.5" ry="6" transform="rotate(-35 13 34)" fill="url(#accentGradIcon)" />
    
    <!-- Right grains -->
    <ellipse cx="26" cy="14" rx="4" ry="7" transform="rotate(30 26 14)" fill="url(#goldGradIcon)" />
    <ellipse cx="28" cy="24" rx="4" ry="7" transform="rotate(35 28 24)" fill="url(#goldGradIcon)" />
    <ellipse cx="27" cy="34" rx="3.5" ry="6" transform="rotate(35 27 34)" fill="url(#goldGradIcon)" />
    
    <!-- Center top grain -->
    <ellipse cx="20" cy="8" rx="3.5" ry="6.5" fill="#f6d365" />
    
    <!-- Oil Droplet / Nutrition base -->
    <path d="M20 42 C16 42, 13 45, 13 48 C13 52, 20 56, 20 56 C20 56, 27 52, 27 48 C27 45, 24 42, 20 42 Z" fill="url(#goldGradIcon)" opacity="0.95" />
  </g>
</svg>
